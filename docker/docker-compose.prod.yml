# Production profile: app container only.
# Postgres and Redis must be reachable via POSTGRES_* / REDIS_* in ../.env (managed cloud).
# Run from repo root — see docker/README.md

services:
  web:
    # CI/CD sets IMAGE + IMAGE_TAG to pull from GHCR; local builds use `build:` below.
    image: ${IMAGE:-social_events_api}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: social_events_api
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "${PORT:-8087}:${PORT:-8087}"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:${PORT:-8087}/health/\", timeout=5)'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - logs_volume:/app/logs
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    restart: unless-stopped

volumes:
  logs_volume:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
